name: Generate Snake

on:
  # Esegue lo script automaticamente ogni 24 ore
  schedule:
    - cron: "0 0 * * *"
  
  # Ti permette di avviarlo manualmente quando vuoi
  workflow_dispatch:
  
  # Si aggiorna ogni volta che modifichi il tuo profilo
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Genera l'animazione del serpente dai tuoi contributi
      - name: generate-github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Nicconcello
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Prende il file appena creato e lo carica in un ramo (branch) chiamato "output"
      - name: push github-contribution-grid-snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
